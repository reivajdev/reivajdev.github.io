<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test · Calidad y Auditoría de Sistemas de Información</title>
<style>
:root{--blue:#1f4e79;--mid:#2e75b6;--bg:#f4f6f9;--card:#fff;--ok:#1e8e51;--okbg:#e7f6ee;--bad:#c0392b;--badbg:#fdecea;--muted:#667;--line:#e3e8ee;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1c2530;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:18px}
header{text-align:center;padding:10px 0 4px}
header h1{font-size:20px;margin:0;color:var(--blue)}
header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.mbtn{background:var(--blue);color:#fff;padding:14px;font-weight:600;font-size:14px;transition:.15s}
.mbtn.sec{background:#eaf0f7;color:var(--blue)}
.mbtn:hover{filter:brightness(1.07)}
select{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);width:100%;background:#fff}
.bar{height:8px;background:#e9eef4;border-radius:6px;overflow:hidden;margin:2px 0 14px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--mid),var(--blue));width:0;transition:.3s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.badge{display:inline-block;background:#eaf0f7;color:var(--blue);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.q{font-size:17px;font-weight:600;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);padding:13px 15px;margin:8px 0;border-radius:10px;transition:.12s;font-size:14.5px}
.opt:hover{border-color:var(--mid);background:#f7fafd}
.opt .lt{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:#eef2f7;border-radius:50%;font-weight:700;font-size:12px;margin-right:9px;color:var(--blue)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#13632f}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:#8e261a}
.opt.bad .lt{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:13px 15px;border-radius:10px;font-size:14px;display:none}
.fb.show{display:block}
.fb.good{background:var(--okbg);border:1px solid #b8e2c8}
.fb.wrong{background:var(--badbg);border:1px solid #f3c3bc}
.fb b{display:block;margin-bottom:3px}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row button{padding:12px 18px;font-weight:600;font-size:14px}
.next{background:var(--blue);color:#fff}
.ghost{background:#eef2f7;color:var(--blue)}
.score{font-weight:700;color:var(--blue)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:vertical}
.model{margin-top:12px;padding:14px;background:#f3f7fb;border:1px solid #d8e6f3;border-radius:10px;font-size:14px;display:none}
.model.show{display:block}
.big{font-size:34px;font-weight:800;color:var(--blue);text-align:center;margin:6px 0}
.center{text-align:center}
.small{font-size:12.5px;color:var(--muted)}
.rev{font-size:13.5px;border-top:1px solid var(--line);padding:10px 0}
.rev .qq{font-weight:600}
.hide{display:none}
@media(max-width:520px){.modes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Test · Calidad y Auditoría de Sistemas de Información</h1>
    <p>Banco unificado de exámenes UNIR (2020–2025) · corrección según el temario</p>
  </header>

  <!-- HOME -->
  <div id="home" class="card">
    <p style="margin:0 0 12px;font-weight:600">Elige un modo de práctica</p>
    <div class="modes">
      <button class="mbtn" onclick="start('examen')">🎯 Simulacro examen<br><span class="small" style="color:#cfe0f3">40 preguntas aleatorias</span></button>
      <button class="mbtn" onclick="start('todas')">📚 Todas las preguntas<br><span class="small" style="color:#cfe0f3" id="cAll"></span></button>
      <button class="mbtn sec" onclick="start('aleatorio')">🔀 Aleatorio (20)<br><span class="small">repaso rápido</span></button>
      <button class="mbtn sec" onclick="document.getElementById('temaBox').classList.toggle('hide')">🗂️ Por tema<br><span class="small">elige uno</span></button>
    </div>
    <div id="temaBox" class="hide" style="margin-top:12px">
      <select id="temaSel"></select>
      <button class="mbtn" style="width:100%;margin-top:10px" onclick="start('tema')">Empezar tema</button>
    </div>
    <div style="margin-top:14px">
      <button class="mbtn sec" style="width:100%" onclick="start('dev')">✍️ Preguntas de desarrollo (con respuesta modelo)</button>
    </div>
    <p class="small" style="margin-top:14px">Sin penalización por fallo. Tras responder verás la respuesta correcta y la explicación basada en los apuntes.</p>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="card hide">
    <div class="meta"><span id="counter"></span><span class="score" id="scoreLbl"></span></div>
    <div class="bar"><i id="progress"></i></div>
    <span class="badge" id="tema"></span>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="row">
      <button class="next hide" id="nextBtn" onclick="next()">Siguiente →</button>
      <button class="ghost" onclick="home()">Salir</button>
    </div>
  </div>

  <!-- DEV -->
  <div id="devview" class="card hide">
    <div class="meta"><span id="devCounter"></span></div>
    <span class="badge" id="devTema"></span>
    <div class="q" id="devQ"></div>
    <textarea id="devA" placeholder="Escribe aquí tu respuesta y compárala con la respuesta modelo..."></textarea>
    <div class="row">
      <button class="next" onclick="document.getElementById('devModel').classList.add('show')">Ver respuesta modelo</button>
      <button class="ghost" id="devNext" onclick="devNext()">Siguiente →</button>
      <button class="ghost" onclick="home()">Salir</button>
    </div>
    <div class="model" id="devModel"></div>
  </div>

  <!-- RESULT -->
  <div id="result" class="card hide">
    <p class="center" style="font-weight:600;margin:0">Resultado</p>
    <div class="big" id="finalScore"></div>
    <p class="center small" id="finalPct"></p>
    <div id="review"></div>
    <div class="row" style="justify-content:center">
      <button class="next" onclick="home()">Volver al inicio</button>
    </div>
  </div>
</div>

<script>
const DATA = {"test": [{"q": "Una de estas características, NO es una característica del aseguramiento de la información:", "opts": ["Calidad", "Confidencialidad", "Integridad"], "correct": "Calidad", "tema": 1, "temaLabel": "Tema 1 · SGSI", "expl": "La triada del aseguramiento es CID (Confidencialidad, Integridad, Disponibilidad). La 'calidad' no forma parte de ella."}, {"q": "Los tres principios fundamentales de los SGSI son:", "opts": ["Confidencialidad, Integridad y Disponibilidad", "Confidencialidad, Privacidad y Autenticación", "Control, Integridad y Duplicación"], "correct": "Confidencialidad, Integridad y Disponibilidad", "tema": 1, "temaLabel": "Tema 1 · SGSI", "expl": "Los tres principios fundamentales (triada CID) son Confidencialidad, Integridad y Disponibilidad."}, {"q": "¿Cuál de los siguientes puntos NO forma parte del desarrollo de una política de seguridad de alto nivel?", "opts": ["Identificar los recursos clave de negocio", "Identificar el tipo de cortafuegos a emplear en la seguridad perimetral", "Definir roles en la organización"], "correct": "Identificar el tipo de cortafuegos a emplear en la seguridad perimetral", "tema": 2, "temaLabel": "Tema 2 · Planificación/Riesgo", "expl": "Elegir el tipo de cortafuegos es una decisión técnica/operativa, no parte de la política de alto nivel."}, {"q": "En el intercambio de información entre dos usuarios, cifrar el hash de un mensaje con una clave simétrica equivale a:", "opts": ["Crear una firma digital", "Proteger la confidencialidad del mensaje", "Crear un código de autenticación de mensaje dependiente de clave"], "correct": "Crear un código de autenticación de mensaje dependiente de clave", "tema": 3, "temaLabel": "Tema 3 · Protección activos I", "expl": "Cifrar el hash con clave SIMÉTRICA crea un MAC (código de autenticación dependiente de clave). Con clave privada sería firma digital."}, {"q": "¿Cuál es la principal obligación de un auditor con respecto al ciclo de vida de un sistema?", "opts": ["Verificar que se cumplen los objetivos de la organización y que cada decisión está avalada por los órganos de dirección", "Verificar que todos los contratos de negocio están debidamente firmados y ejecutados por los órganos de dirección", "Verificar que los controles internos son validados antes de su implementación por una tercera parte"], "correct": "Verificar que se cumplen los objetivos de la organización y que cada decisión está avalada por los órganos de dirección", "tema": 9, "temaLabel": "Tema 9 · Proceso de auditoría", "expl": "El auditor verifica que se cumplen los objetivos de la organización y que cada decisión está avalada por la dirección."}, {"q": "¿Cuál es la capa 4 del modelo OSI?:", "opts": ["Sesión", "Transporte", "Red"], "correct": "Transporte", "tema": 4, "temaLabel": "Tema 4 · Protección activos II (redes)", "expl": "La capa 4 del modelo OSI es la de Transporte."}, {"q": "¿Cuál de las siguientes auditorías es obligatoria?", "opts": ["La auditoría externa", "La auditoría de verificación", "La auditoría de certificación"], "correct": "La auditoría de verificación", "tema": 6, "temaLabel": "Tema 6 · Tipos de auditoría", "expl": "La auditoría de verificación (de cumplimiento legal/normativo) es obligatoria."}, {"q": "Un delito informático:", "opts": ["Es un tipo de delito llevado a cabo por un profesional de la informática o por alguien con competencias avanzadas en TIC", "Es un delito recogido en el Código Penal que hace uso de la informática como medio u objetivo", "Es una acción tipificada como delito en la LOPD y que utiliza la informática como medio u objetivo"], "correct": "Es un delito recogido en el Código Penal que hace uso de la informática como medio u objetivo", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "Un delito informático está recogido en el Código Penal y usa la informática como medio u objetivo."}, {"q": "Dentro de las metodologías de auditoría informática se distinguen:", "opts": ["10 fases distintas", "Tres componentes: la etapa fuzzing, el paso SAST y la fase DAST", "Dos tipos de metodologías: metodologías relativas a controles generales y metodologías establecidas por los auditores internos"], "correct": "Dos tipos de metodologías: metodologías relativas a controles generales y metodologías establecidas por los auditores internos", "tema": 9, "temaLabel": "Tema 9 · Proceso de auditoría", "expl": "Hay dos metodologías: las de controles generales y las de los auditores internos."}, {"q": "Según el NIST el plan de continuidad de negocio consta de:", "opts": ["4 fases", "3 fases", "2 fases"], "correct": "4 fases", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "Según el NIST (SP 800-34) el PCN consta de 4 fases."}, {"q": "La gobernanza TIC:", "opts": ["Viene determinada biunívocamente por la gestión de los sistemas y tecnologías de la información y de las comunicaciones.", "Persigue el alineamiento entre objetivos estratégicos y principios tecnológicos de eficacia y eficiencia.", "Está definido exclusivamente por el marco legal dado por el Código Penal, la LOPD y la LSSICE."], "correct": "Persigue el alineamiento entre objetivos estratégicos y principios tecnológicos de eficacia y eficiencia.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "La gobernanza TIC busca alinear los objetivos estratégicos con la eficacia y eficiencia tecnológicas."}, {"q": "¿Cuál de las siguientes afirmaciones es falsa?", "opts": ["El gobierno TIC opera ex ante.", "La adquisición y gestión de activos TIC es cometido del gobierno TIC.", "El gobierno TIC opera ex post."], "correct": "El gobierno TIC opera ex post.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "Es FALSA: el gobierno TIC opera ex ante (mira al futuro), no ex post."}, {"q": "¿Qué actor no forma parte de la gobernanza TIC de una empresa?", "opts": ["El usuario final.", "El CIO.", "El auditor."], "correct": "El usuario final.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "El usuario final no es actor de la gobernanza TIC (sí lo son consejeros, CIO, financiero, auditores)."}, {"q": "El uso de medios tecnológicos, como una red Wi-Fi ajena:", "opts": ["Es un delito informático si la red está debidamente protegida.", "Es un delito informático en cualquier caso.", "Es un delito informático si se usa dicho medio para perpetrar una acción tipificada como delito por el Código Penal."], "correct": "Es un delito informático si la red está debidamente protegida.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "Acceder a una red wifi ajena es delito si la red está debidamente protegida."}, {"q": "¿Cuál de los siguientes no es un principio fundamental de protección de datos?", "opts": ["Consentimiento de los menores de edad.", "Tratamiento de datos de naturaleza penal.", "Transparencia e información al afectado."], "correct": "Transparencia e información al afectado.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "La transparencia e información al afectado es un DERECHO, no un principio de protección de datos."}, {"q": "Según la LOPD datos como la ideología de una persona deben protegerse...", "opts": ["de acuerdo a un nivel bajo de protección.", "de acuerdo a un nivel medio de protección.", "de acuerdo a un nivel alto de protección."], "correct": "de acuerdo a un nivel alto de protección.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "Los datos especialmente protegidos (ideología) requieren el nivel ALTO de protección."}, {"q": "El arranque en caliente de un sistema de recuperación ante desastres:", "opts": ["Es una solución solo válida para el corto plazo.", "Es una solución solo válida para el largo plazo.", "Tiene un elevado coste comparada con el arranque en frío."], "correct": "Tiene un elevado coste comparada con el arranque en frío.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "El arranque en caliente tiene un coste muy elevado frente al arranque en frío (sirve a corto y largo plazo)."}, {"q": "La gestión del personal:", "opts": ["Es una pieza clave del plan de continuidad de negocio.", "Solo compete a los organismos estatales de control de riesgos y de seguridad en puestos de trabajo.", "Solo debe incluirse en el proceso de reacción a interrupciones y desastres si la actividad de negocio involucra el manejo de materiales inflamables o tóxicos."], "correct": "Es una pieza clave del plan de continuidad de negocio.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "La gestión del personal es una pieza clave del plan de continuidad de negocio."}, {"q": "Las herramientas CAAT:", "opts": ["Son empleadas en el proceso de análisis como complemento de las tecnologías DAST.", "Se emplean para guiar y facilitar la recolección y gestión de evidencias.", "Son herramientas de footpring."], "correct": "Se emplean para guiar y facilitar la recolección y gestión de evidencias.", "tema": 9, "temaLabel": "Tema 9 · Proceso de auditoría", "expl": "Las CAAT (Computer Assisted Audit Tools) guían y facilitan la recolección y gestión de evidencias."}, {"q": "El primer paso de una auditoría informática:", "opts": ["Es el análisis de riesgo.", "Es la redacción de los puntos bases del proceso auditoría y la firma (validación y aceptación) del documento del compromiso de los agentes implicados.", "Es determinar si se puede llevar a cabo la auditoria."], "correct": "Es la redacción de los puntos bases del proceso auditoría y la firma (validación y aceptación) del documento del compromiso de los agentes implicados.", "tema": 9, "temaLabel": "Tema 9 · Proceso de auditoría", "expl": "El primer paso es la aprobación y firma del documento de objetivos y compromisos de auditoría."}, {"q": "Toda planificación de una auditoría informática:", "opts": ["Debe contar con la aprobación y aceptación de responsabilidad por parte del CEO.", "Solo compete a los miembros del departamento TIC de un organismo o institución.", "Debe contemplar el papel fundamental del auditor a la hora de realizar cambios en las infraestructuras y lógica TIC tras el diagnóstico del proceso de auditoría."], "correct": "Debe contar con la aprobación y aceptación de responsabilidad por parte del CEO.", "tema": 9, "temaLabel": "Tema 9 · Proceso de auditoría", "expl": "Toda planificación de auditoría debe contar con la aprobación y aceptación de responsabilidad de la dirección (CEO)."}, {"q": "Citrix:", "opts": ["Es una herramienta para el análisis de vulnerabilidades.", "Es un protocolo de extensión de funcionalidades para servidores DNS.", "Es un servicio vinculado a la ejecución de escritorios remotos."], "correct": "Es un servicio vinculado a la ejecución de escritorios remotos.", "tema": 8, "temaLabel": "Tema 8 · Vulnerabilidades", "expl": "Citrix es un servicio vinculado a la ejecución de escritorios remotos (RDP)."}, {"q": "La transferencia de zona:", "opts": ["Es un volcado (dump) de todos los registros de un servidor DNS pertenecientes a una zona específica.", "Es el trasvase de información de una base de datos de vulnerabilidades privada a una pública.", "Es el trasvase de información de una base de datos de vulnerabilidades de una organización a otra."], "correct": "Es un volcado (dump) de todos los registros de un servidor DNS pertenecientes a una zona específica.", "tema": 8, "temaLabel": "Tema 8 · Vulnerabilidades", "expl": "La transferencia de zona es un volcado (dump) de todos los registros de un servidor DNS de una zona."}, {"q": "¿Cuál de las siguientes herramientas no se emplea en el escaneado de puertos?", "opts": ["netstat.", "nmap.", "Cain&Abel."], "correct": "Cain&Abel.", "tema": 8, "temaLabel": "Tema 8 · Vulnerabilidades", "expl": "Cain&Abel es una herramienta de cracking de contraseñas, no de escaneo de puertos (sí lo son nmap y netstat)."}, {"q": "El objetivo del footprinting es:", "opts": ["Obtener un mapa de red de comunicaciones de la empresa para iniciar un test de penetración y determinar las vulnerabilidades.", "Obtener todo el tráfico de red que llega a un dispositivo para deducir información de su configuración.", "Obtener todo el tráfico de red que llega a un dispositivo para determinar las vulnerabilidades."], "correct": "Obtener un mapa de red de comunicaciones de la empresa para iniciar un test de penetración y determinar las vulnerabilidades.", "tema": 7, "temaLabel": "Tema 7 · Recolección de información", "expl": "El footprinting busca obtener el mapa de la red para iniciar un test de penetración."}, {"q": "Nmap es un ejemplo:", "opts": ["De test de penetración.", "De fingerprinting activo.", "De fingerprinting pasivo."], "correct": "De fingerprinting activo.", "tema": 7, "temaLabel": "Tema 7 · Recolección de información", "expl": "Nmap es un ejemplo de fingerprinting activo (p0f sería pasivo)."}, {"q": "La técnica denominada fingerprinting:", "opts": ["Es un procedimiento empleado en la auditoría informática.", "Tiene por objetivo caracterizar la topología y características de redes de datos.", "Tiene por foco un cierto dispositivo sobre el cual quiere extraer información que pueda ser relevante para un análisis forense, un test de penetración o un análisis de vulnerabilidades."], "correct": "Tiene por foco un cierto dispositivo sobre el cual quiere extraer información que pueda ser relevante para un análisis forense, un test de penetración o un análisis de vulnerabilidades.", "tema": 7, "temaLabel": "Tema 7 · Recolección de información", "expl": "El fingerprinting tiene por foco un dispositivo concreto del que extraer información."}, {"q": "La auditoría de protección de datos personales:", "opts": ["Es voluntaria.", "En realidad es un control interno.", "Es obligatoria."], "correct": "Es obligatoria.", "tema": 6, "temaLabel": "Tema 6 · Tipos de auditoría", "expl": "La auditoría de protección de datos personales es obligatoria."}, {"q": "¿Cómo se evalúa la independencia en los procedimientos de verificación de un io."}, {"q": "La certificación CISA está asociada a:", "opts": ["ISACA.", "(ISC)2.", "AENOR."], "correct": "ISACA.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "La certificación CISA está asociada a ISACA."}, {"q": "El principio de ejecución compete a:", "opts": ["El gobierno de negocio.", "El gobierno TIC.", "El gobierno corporativo."], "correct": "El gobierno de negocio.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "El principio de ejecución compete al gobierno de negocio."}, {"q": "La LSSICE se aplica:", "opts": ["A todos aquellos negocios que utilicen medios TIC para realizar su actividad o para la promoción de la misma.", "A los delitos de espionaje industrial.", "A la custodia de datos personales."], "correct": "A todos aquellos negocios que utilicen medios TIC para realizar su actividad o para la promoción de la misma.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "La LSSICE se aplica a los negocios que usan medios TIC para su actividad o promoción."}, {"q": "Un ejemplo de ciberterrorismo es:", "opts": ["Es el spam telefónico.", "Ataques DDoS.", "Escalada de privilegios por parte de un empleado que acaba de ser despedido."], "correct": "Ataques DDoS.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "Un ataque DDoS es un ejemplo de ciberterrorismo."}, {"q": "El gestor senior:", "opts": ["Debe formar parte del plan de recuperación ante desastres.", "Debe formar parte del plan de recuperación ante desastres e intervenir en el proceso de recuperación.", "Debe formar parte del plan de recuperación ante desastres y estará encargado de la política de comunicación en caso de desastre."], "correct": "Debe formar parte del plan de recuperación ante desastres y estará encargado de la política de comunicación en caso de desastre.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "El gestor senior forma parte del PRD y se encarga de la política de comunicación torización y auditabilidad."}, {"q": "Un ataque por interceptación afecta a:", "opts": ["La disponibilidad de los datos.", "La confidencialidad de los datos.", "La autenticación de los datos."], "correct": "La confidencialidad de los datos.", "tema": 1, "temaLabel": "Tema 1 · SGSI", "expl": "Un ataque por interceptación afecta a la confidencialidad."}, {"q": "El principio de conformidad compete a:", "opts": ["El gobierno de negocio.", "El gobierno TIC.", "El gobierno corporativo."], "correct": "El gobierno corporativo.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "El principio de conformidad compete al gobierno corporativo."}, {"q": "El gobierno de las TIC se apoya:", "opts": ["En seis principios.", "En cuatro principios.", "En tres principios."], "correct": "En seis principios.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "El gobierno de las TIC se apoya en seis principios (ISO 38500)."}, {"q": "¿Cuál de los siguientes principios de gobernanza TIC se encarga de satisfacer la legislación vigente?", "opts": ["Estrategia.", "Conformidad.", "Responsabilidad."], "correct": "Conformidad.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "El principio que satisface la legislación vigente es la conformidad."}, {"q": "El análisis forense:", "opts": ["Se efectúa tras la ocurrencia de algún tipo de evento o por la detección de algún indicio de actividad anormal en un momento concreto y específico.", "Se emplea en la monitorización continua de los servicios de seguridad y de los controles internos de una organización.", "Trata de detectar vulnerabilidades que pudieran ser explotadas por un intruso."], "correct": "Se efectúa tras la ocurrencia de algún tipo de evento o por la detección de algún indicio de actividad anormal en un momento concreto y específico.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "El análisis forense se efectúa tras un evento o indicio de actividad anormal, en un momento concreto."}, {"q": "La auditoria informática:", "opts": ["Está basada en el criterio de Daubert.", "Tiene carácter y objetivo probatorio.", "Su objetivo es validar medidas de seguridad adoptadas en correspondencia con marcos legales y normativos, así como con guías de recomendaciones y estándares de certificación."], "correct": "Su objetivo es validar medidas de seguridad adoptadas en correspondencia con marcos legales y normativos, así como con guías de recomendaciones y estándares de certificación.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "La auditoría informática valida medidas de seguridad según marcos legales, guías y estándares."}, {"q": "Las pruebas informáticas:", "opts": ["No tienen fuerza probatoria en sede judicial.", "Tienen fuerza probatoria, y solo si existe evidencia directa y se respeta la cadena de custodia.", "Solo tienen valor cuando se investigan delitos de evasión fiscal."], "correct": "Tienen fuerza probatoria, y solo si existe evidencia directa y se respeta la cadena de custodia.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "Las pruebas informáticas tienen fuerza probatoria solo con evidencia directa y respetando la cadena de custodia."}, {"q": "El plan de recuperación ante desastres debe...", "opts": ["incluir mecanismos de respaldo como acuerdos con otros organismos, contratación de servicios de arranque en frío, en templado o en caliente o bien se puede optar por incluir redundancias en las transacciones.", "contar con acuerdos con otras empresas para hacer frente a desastres de larga duración.", "contar con planes de recuperación ante desastres redundantes como salvaguarda frente a eventualidades."], "correct": "incluir mecanismos de respaldo como acuerdos con otros organismos, contratación de servicios de arranque en frío, en templado o en caliente o bien se puede optar por incluir redundancias en las transacciones.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "El PRD debe incluir mecanismos de respaldo (acuerdos, arranque frío/templado/caliente o redundancia en transacciones)."}, {"q": "El equipo involucrado en la gestión de un plan de continuidad de negocio:", "opts": ["Solo incluye a miembros del comité ejecutivo de la empresa.", "Solo incluye a miembros del departamento TIC.", "Incluye al gestor senior, a representantes de todas las unidades funcionales, al equipo de gestión de desastres y al equipo de respuesta ante emergencias."], "correct": "Incluye al gestor senior, a representantes de todas las unidades funcionales, al equipo de gestión de desastres y al equipo de respuesta ante emergencias.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "El equipo del PCN incluye al gestor senior, representantes de las unidades, equipo de gestión de desastres y de respuesta ante emergencias."}, {"q": "El análisis de riesgos:", "opts": ["Debe emplearse para establecer si es procedente un plan de continuidad de negocios: si apenas hay riesgos no es necesario tal tipo de planificación.", "Es competencia exclusiva del gestor senior que dirige el diseño y gestión del plan de continuidad de negocio.", "Permite determinar el nivel crítico de activos contando con los propietarios de los mismos, lo que permite ponderar si es preciso incorporar salvaguardas específicas que garanticen una rápida recuperación tras una interrupción de servicio."], "correct": "Permite determinar el nivel crítico de activos contando con los propietarios de los mismos, lo que permite ponderar si es preciso incorporar salvaguardas específicas que garanticen una rápida recuperación tras una interrupción de servicio.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "El análisis de riesgos permite determinar el nivel crítico de activos (con sus propietarios) y ponderar salvaguardas."}, {"q": "De acuerdo con la definición de evidencia en el ámbito legal, podemos distinguir dos tipos de evidencias:", "opts": ["Directas (evidencias probatorias) y Documentales (transacciones, recibos, facturas, ficheros log, etc.)", "Indirectas (evidencias circunstanciales) y Documentales (transacciones, recibos, facturas, ficheros log, etc.)", "Directas (evidencias probatorias) y Indirectas (evidencias circunstanciales)"], "correct": "Directas (evidencias probatorias) y Indirectas (evidencias circunstanciales)", "tema": 9, "temaLabel": "Tema 9 · Proceso de auditoría", "expl": "Dos tipos de evidencias: directas (probatorias) e indirectas (circunstanciales)."}, {"q": "El análisis cuantitativo de riesgos:", "opts": ["Es más caro que el análisis cualitativo.", "Requiere un alto grado de intuición por parte del analista.", "Debe realizarse obligatoriamente de modo manual."], "correct": "Es más caro que el análisis cualitativo.", "tema": 2, "temaLabel": "Tema 2 · Planificación/Riesgo", "expl": "El análisis cuantitativo de riesgos es más caro que el cualitativo."}, {"q": "El ataque Cross site request forgery:", "opts": ["Es un ataque por denegación de servicio.", "Es una variante del XSS reflejado.", "Se produce porque no se realiza una correcta gestión de sesiones de usuario."], "correct": "Se produce porque no se realiza una correcta gestión de sesiones de usuario.", "tema": 8, "temaLabel": "Tema 8 · Vulnerabilidades", "expl": "El CSRF se produce por una mala gestión de las sesiones de usuario."}, {"q": "¿Qué modalidad de XSS implica una modificación del código fuente del servidor web?", "opts": ["XSS persistente.", "XSS reflejado.", "XSS consistente."], "correct": "XSS persistente.", "tema": 8, "temaLabel": "Tema 8 · Vulnerabilidades", "expl": "El XSS persistente modifica datos almacenados en el servidor."}, {"q": "La enumeración...", "opts": ["de vulnerabilidades, es el paso previo a todo análisis de seguridad.", "de puertos abiertos e identificación de servicios asociados a los mismos, es pieza clave en el análisis de vulnerabilidades.", "es una metodología propia de la contabilidad, que temaLabel": "Tema 7 · Recolección de información", "expl": "El análisis forense es un control que se aplica DESPUÉS del incidente."}, {"q": "La auditoría externa:", "opts": ["Se lleva a cabo de modo continuo.", "Solo tiene implicaciones a efectos de responsabilidad técnica.", "Se efectúa de modo periódico, normalmente una vez al año."], "correct": "Se efectúa de modo periódico, normalmente una vez al año.", "tema": 6, "temaLabel": "Tema 6 · Tipos de auditoría", "expl": "La auditoría externa se efectúa de modo periódico, normalmente una vez al año."}, {"q": "El control interno:", "opts": ["Se lleva a cabo de modo continuo.", "Se efectúa una vez al año.", "Entra en juego solo después de una incidencia."], "correct": "Se lleva a cabo de modo continuo.", "tema": 6, "temaLabel": "Tema 6 · Tipos de auditoría", "expl": "El control interno se lleva a cabo de modo continuo (día a día)."}, {"q": "Un cortafuegos es un control:", "opts": ["Físico.", "Lógico.", "Disuasorio."], "correct": "Lógico.", "tema": 5, "temaLabel": "Tema 5 · Controles internos", "expl": "Un cortafuegos es un control lógico."}, {"q": "Un IDS es un control:", "opts": ["Detectivo.", "Preventivo.", "Lógico."], "correct": "Detectivo.", "tema": 5, "temaLabel": "Tema 5 · Controles internos", "expl": "Un IDS es un control detectivo."}, {"q": "¿Cuál de los siguientes enunciados no es aplicable al despliegue de medidas de protección de las instalaciones y activos de una organización?", "opts": ["Las paredes deben tener un índice de contención de incendios suficientemente alto.", "Las ventanas han de estar protegidas mediante barrotes.", "Las puertas deben ser resistentes frente a intentos de forzarlas."], "correct": "Las ventanas han de estar protegidas mediante barrotes.", "tema": 5, "temaLabel": "Tema 5 · Controles internos", "expl": "NO es aplicable: ventanas con barrotes; lo correcto son ventanas antirrotura."}, {"q": "Con el objeto de asegurar la privacidad e integridad de los datos, las conexiones entre corta s se basan en objetivos de control de acceso en función de la labor desempeñada por un cierto cargo o usuario."], "correct": "Los controles basados en reglas asignan parámetros de acceso a las cuentas de usuario, mientras que los controles basados en roles se basan en objetivos de control de acceso en función de la labor desempeñada por un cierto cargo o usuario.", "tema": 3, "temaLabel": "Tema 3 · Protección activos I", "expl": "Las reglas asignan parámetros a las cuentas; los roles se basan en la labor/cargo del usuario."}, {"q": "¿Qué método de backup, de los listados a continuación, requiere utilizar el mayor número de cintas por parte del operador para llevar a cabo una restauración completa del sistema, si cada noche se utiliza una cinta distinta con rotación cada cinco días?", "opts": ["Backup total.", "Backup diferencial.", "Backup incremental."], "correct": "Backup incremental.", "tema": 3, "temaLabel": "Tema 3 · Protección activos I", "expl": "El backup incremental requiere más cintas para una restauración completa (rotación de 5 días)."}, {"q": "A la gobernanza corporativa compete:", "opts": ["La separación de la propiedad y el control.", "La dirección y control del negocio.", "La dirección y control TIC."], "correct": "La dirección y control del negocio.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "A la gobernanza corporativa compete la dirección y control del negocio."}, {"q": "¿Qué norma ISO está más relacionada con el gobierno de las TIC?", "opts": ["ISO 27001.", "ISO 20200.", "ISO 38500."], "correct": "ISO 38500.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "La norma ISO más relacionada con el gobierno de las TIC es la ISO 38500."}, {"q": "El principio de Locard:", "opts": ["Está establecido en la LSSICE.", "Se define como uno de los principios fundamentales que regulan los derechos de los ciudadanos de acuerdo con la Constitución Española.", "Constituye un elemento clave del análisis forense."], "correct": "Constituye un elemento clave del análisis forense.", "tema": 11, "temaLabel": "Tema 11 · Marco legal", "expl": "El principio de Locard ('todo contacto deja rastro') es clave del análisis forense."}, {"q": "El plan de continuidad de negocio:", "opts": ["Es diseñado por el CIO, esto es, por el responsable del departamento TIC.", "Junto con el Plan de Recuperación ante Desastres (PRD) son el eje de la estrategia de gestión de la continuidad de negocio.", "Solo es necesario en el caso de que nuestra empresa sea un proveedor de servicios incluido en la infraestructura crítica de un país."], "correct": "Junto con el Plan de Recuperación ante Desastres (PRD) son el eje de la estrategia de gestión de la continuidad de negocio.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "El PCN, junto con el PRD, son el eje de la estrategia de gestión de la continuidad de negocio."}, {"q": "El plan de recuperación ante desastres:", "opts": ["Está focalizado fundamentalmente en la reinstauración de los procesos tecnológicos asociados al manejo de datos.", "Involucra a un equipo de trabajo.", "Solo cuenta con personal del departamento TIC."], "correct": "Involucra a un equipo de trabajo.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "El plan de recuperación ante desastres involucra a un equipo de trabajo."}, {"q": "En la última fase del ciclo de vida en el desarrollo de sistemas, se debe:", "opts": ["dictaminar los beneficios (económicos u operativos) que se esperan del nuevo sistema, así como los costes asociados a su implantación.", "proceder a la completa y correcta eliminación de todos los datos almacenados en discos duros, papel, etc.", "generar un plan o estrategia que sustancie los objetivos de las fases 1 (Estudio de viabilidad) y 2 (Definición de requerimientos)."], "correct": "proceder a la completa y correcta eliminación de todos los datos almacenados en discos duros, papel, etc.", "tema": 9, "temaLabel": "Tema 9 · Proceso de auditoría", "expl": "En la última fase del ciclo de vida (terminación) se eliminan de forma segura todos los datos."}, {"q": "DAST:", "opts": ["Es un estándar SDC.", "Es un marco de herramientas fuzzing.", "Son las siglas inglesas para herramientas de análisis dinámico de aplicaciones."], "correct": "Son las siglas inglesas para herramientas de análisis dinámico de aplicaciones.", "tema": 9, "temaLabel": "Tema 9 · Proceso de auditoría", "expl": "DAST = siglas inglesas de herramientas de análisis dinámico de aplicaciones."}, {"q": "¿Qué tipo de vulnerabilidad se produce cuando no se comprueban los argumentos de entrada de la información?", "opts": ["Cross site request forgery.", "Cross site scripting.", "Inyección SQL."], "correct": "Inyección SQL.", "tema": 8, "temaLabel": "Tema 8 · Vulnerabilidades", "expl": "No comprobar los argumentos de entrada provoca la inyección SQL."}, {"q": "La técnica de fuzzing:", "opts": ["Se utiliza por un ataque para generar ruido en un sistema de información.", "Se utiliza para ver el comportamiento de un programa respecto a entradas no estándar.", "Es de carácter estático."], "correct": "Se utiliza para ver el comportamiento de un programa respecto a entradas no estándar.", "tema": 8, "temaLabel": "Tema 8 · Vulnerabilidades", "expl": "El fuzzing sirve para ver el comportamiento de un programa ante entradas no estándar."}, {"q": "¿Cuál de las siguientes fases no forma parte del ciclo de vida del análisis forense?", "opts": ["Análisis.", "Diseño de sistemas TIC.", "Adquisición."], "correct": "Diseño de sistemas TIC.", "tema": 7, "temaLabel": "Tema 7 · Recolección de información", "expl": "El 'diseño de sistemas TIC' NO es una fase del análisis forense (sí lo son adquisición, análisis y presentación)."}, {"q": "El objetivo de todo análisis forense es:", "opts": ["Encontrar y registrar fallos en el sistema debidos a errores de programación.", "Encontrar y registrar fallos en el sistema fruto de un mal uso de las tecnologías.", "Encontrar hechos partiendo del análisis de artefactos."], "correct": "Encontrar hechos partiendo del análisis de artefactos.", "tema": 7, "temaLabel": "Tema 7 · Recolección de información", "expl": "El objetivo del análisis forense es encontrar hechos partiendo del análisis de artefactos."}, {"q": "El sistema de control interno:", "opts": ["Es equivalente a una auditoría interna.", "Es un mecanismo de control para vigilar la correcta realización de auditorías internas y externas.", "Solo cubre el área de las tecnologías y sistemas de información."], "correct": "Solo cubre el área de las tecnologías y sistemas de información.", "tema": 6, "temaLabel": "Tema 6 · Tipos de auditoría", "expl": "El sistema de control interno (informático) solo cubre el área de las TIC."}, {"q": "Un auditor interno ha de informar a:", "opts": ["Al responsable de la auditoría externa.", "Al responsable del área de tecnologías y sistemas de información.", "A los órganos de alta dirección de la organización."], "correct": "A los órganos de alta dirección de la organización.", "tema": 6, "temaLabel": "Tema 6 · Tipos de auditoría", "expl": "El auditor interno informa a los órganos de alta dirección de la organización."}, {"q": "¿Cuál de las siguientes definiciones no se ajusta a la descripción de un control?", "opts": ["Los controles detectivos descubren ataques y activan controles preventivos o correctivos.", "Los controles correctivos reducen el efecto de un ataque.", "Los controles correctivos reducen la posibilidad de un ataque deliberado."], "correct": "Los controles correctivos reducen la posibilidad de un ataque deliberado.", "tema": 5, "temaLabel": "Tema 5 · Controles internos", "expl": "NO se ajusta: 'los controles correctivos reducen la posibilidad de un ataque' (eso sería preventivo/disuasorio)."}, {"q": "¿Cuál de los siguientes protocolos proporciona mayor seguridad en redes wifi?", "opts": ["WEP.", "WPA.", "PGP."], "correct": "WPA.", "tema": 4, "temaLabel": "Tema 4 · Protección activos II (redes)", "expl": "Entre las opciones, WPA proporciona mayor seguridad que WEP (PGP no es wifi)."}, {"q": "¿Qué cortafuegos emplea una tabla dinámica de estado para examinar el contenido de los paquetes?", "opts": ["Un cortafuegos de filtrado de paquetes.", "Un cortafuegos de nivel de aplicación.", "Un cortafuegos de inspección de estado."], "correct": "Un cortafuegos de inspección de estado.", "tema": 4, "temaLabel": "Tema 4 · Protección activos II (redes)", "expl": "El cortafuegos de inspección de estado emplea una tabla dinámica de estado."}, {"q": "¿Cuál de los siguientes métodos de backup es el más adecuado para un almacenamiento externo, fuera el emplazamiento habitual de nuestro negocio?", "opts": ["Backup total.", "Backup diferencial.", "Backup incremental."], "correct": "Backup total.", "tema": 3, "temaLabel": "Tema 3 · Protección activos I", "expl": "Para almacenamiento externo el más adecuado es el backup total (restauración más rápida)."}, {"q": "En criptografía de clave pública:", "opts": ["Solo la clave privada puede cifrar y solo la clave pública puede descifrar.", "La clave pública es utilizada para cifrar y descifrar.", "Si la clave pública cifra, solo la clave privada puede descifrar."], "correct": "Si la clave pública cifra, solo la clave privada puede descifrar.", "tema": 3, "temaLabel": "Tema 3 · Protección activos I", "expl": "En cripto de clave pública: si la clave pública cifra, solo la privada puede descifrar."}, {"q": "El gobierno de las TIC:", "opts": ["Está restringido al dominio TIC interno de una organización.", "Es competencia exclusiva del Estado.", "Apunta a la dimensión estratégica de un negocio."], "correct": "Apunta a la dimensión estratégica de un negocio.", "tema": 12, "temaLabel": "Tema 12 · Gobernanza y certificaciones", "expl": "El gobierno de las TIC apunta a la dimensión estratégica del negocio."}, {"q": "¿Por qué un análisis del riesgo requiere la intervención de representantes de todos los departamentos de una empresa?", "opts": ["Para asegurar que todo el personal está involucrado.", "Para asegurar que se cubren todos los posibles riesgos en el análisis.", "Para responsabilizar a cada área respecto al riesgo en ella presente."], "correct": "Para asegurar que se cubren todos los posibles riesgos en el análisis.", "tema": 2, "temaLabel": "Tema 2 · Planificación/Riesgo", "expl": "Participan todos los departamentos para asegurar que se cubren todos los posibles riesgos."}, {"q": "¿Cuál de los siguientes IDS sólo es efectivo contra métodos de ataque conocidos?:", "opts": ["IDS de host.", "IDS basado en conocimiento.", "IDS basado en comportamiento."], "correct": "IDS basado en conocimiento.", "tema": 3, "temaLabel": "Tema 3 · Protección activos I", "expl": "El IDS basado en conocimiento (firmas) solo es efectivo contra ataques conocidos."}, {"q": "Una base de datos relacional proporciona seguridad a través de las vistas. ¿Qué principio de seguridad sustentan las vistas?", "opts": ["Mínimo privilegio.", "Agregación.", "Inferencia."], "correct": "Mínimo privilegio.", "tema": 3, "temaLabel": "Tema 3 · Protección activos I", "expl": "Las vistas de una BD relacional sustentan el principio de mínimo privilegio."}, {"q": "La búsqueda, identificación y clasificación de vulnerabilidades:", "opts": ["Debe mantenerse en secreto y nunca publicar los resultados del análisis.", "Todas las vulnerabilidades detectadas deben hacerse públicas.", "Debe efectuarse combinando adecuadamente bases de datos públicas y bases de datos propias"], "correct": "Debe efectuarse combinando adecuadamente bases de datos públicas y bases de datos propias", "tema": 8, "temaLabel": "Tema 8 · Vulnerabilidades", "expl": "La búsqueda de vulnerabilidades combina bases de datos públicas y propias."}, {"q": "La política de comunicación:", "opts": ["Es competencia del plan de continuidad de negocio.", "Es parte del plan de recuperación ante desastres.", "No forma parte ni del plan de continuidad de negocio ni del plan de recuperación ante desastres."], "correct": "Es parte del plan de recuperación ante desastres.", "tema": 10, "temaLabel": "Tema 10 · Continuidad y recuperación", "expl": "La política de comunicación forma parte del plan de recuperación ante desastres."}, {"q": "La seguridad:", "opts": ["Es un proceso y no un producto.", "Es una propiedad ad hoc que solo se alcanza configurando adecuadamente la infraestructura final de un diseño.", "Es un producto que se adquiere e instala una sola vez."], "correct": "Es un proceso y no un producto.", "tema": 1, "temaLabel": "Tema 1 · SGSI", "expl": "La seguridad es un proceso y no un producto (Schneier)."}], "dev": [{"q": "¿Qué es un control interno? ¿Cuál es su objetivo y para qué se utiliza? Enumere y explique los distintos tipos de controles en función de sus niveles de operación. Para cada uno indique sobre qué propiedad del activo y contra qué amenazas actúa.", "tema": 5, "temaLabel": "Tema 5 · Controles internos", "model": "Un control interno es cualquier actividad/acción (manual o automática) para prevenir, detectar o corregir errores o irregularidades que afecten al funcionamiento del sistema y a la consecución de sus objetivos. Objetivo: monitorizar y mejorar de forma continua las medidas de seguridad. Niveles de operación: (1) ADMINISTRATIVOS: políticas, procedimientos, formación/concienciación y gestión de RRHH; favorecen mínimo privilegio, separación y rotación de tareas. (2) TÉCNICOS/LÓGICOS: restringen el acceso vía software/hardware (cortafuegos, proxies, cifrado, ACL, IDS); protegen sobre todo confidencialidad e integridad frente a accesos no autorizados, malware e interceptación. (3) FÍSICOS: protegen recursos e instalaciones (CCTV, SAI, control de acceso, climatización, anti-incendios); la propiedad CID más implicada es la DISPONIBILIDAD, frente a amenazas naturales, internas y humanas. Además se clasifican por su forma de tratar la amenaza: preventivos, detectivos y correctivos (+ disuasorios)."}, {"q": "¿Qué es y para qué sirve el análisis forense? Explique sus características fundamentales y elabore un esquema con las etapas de un proceso de análisis forense, detallando las tareas de cada etapa.", "tema": 7, "temaLabel": "Tema 7 · Recolección de información", "model": "El análisis forense digital combina derecho e informática para recopilar y analizar datos de forma admisible como prueba ante un tribunal. Sirve para reconstruir la verdad de un evento a partir de rastros parciales (artefactos/evidencias) tras un incidente; tiene carácter PROBATORIO. Características: ventana temporal acotada a un incidente; información intangible; puede interferir con el negocio; requiere especialista; debe respetar la cadena de custodia (principio de Locard, criterio de Daubert). ETAPAS: (1) ADQUISICIÓN/CAPTURA: crear un duplicado (copia de trabajo) del medio original y registrar todas las acciones. (2) ANÁLISIS: identificación de ítems relevantes → análisis (sistema de ficheros, contenido, logs, estadística) → interpretación de resultados. (3) PRESENTACIÓN: informe a quien lo encargó con acciones realizadas, artefactos identificados y su significado."}]};
let pool=[], idx=0, score=0, wrong=[], answered=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

// init tema select + counts
(function(){
  document.getElementById('cAll').textContent = DATA.test.length + ' preguntas';
  const temas=[...new Set(DATA.test.map(q=>q.tema))].sort((a,b)=>a-b);
  const sel=document.getElementById('temaSel');
  temas.forEach(t=>{
    const n=DATA.test.filter(q=>q.tema===t).length;
    const lbl=DATA.test.find(q=>q.tema===t).temaLabel;
    const o=document.createElement('option');o.value=t;o.textContent=lbl+' ('+n+')';sel.appendChild(o);
  });
})();

function show(id){['home','quiz','devview','result'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide');window.scrollTo(0,0);}
function home(){show('home');}

function start(mode){
  if(mode==='dev'){startDev();return;}
  let qs=DATA.test;
  if(mode==='examen') pool=shuffle(qs).slice(0,Math.min(40,qs.length));
  else if(mode==='aleatorio') pool=shuffle(qs).slice(0,20);
  else if(mode==='tema'){const t=+document.getElementById('temaSel').value;pool=shuffle(qs.filter(q=>q.tema===t));}
  else pool=shuffle(qs);
  idx=0;score=0;wrong=[];render();show('quiz');
}

function render(){
  answered=false;
  const q=pool[idx];
  document.getElementById('counter').textContent='Pregunta '+(idx+1)+' / '+pool.length;
  document.getElementById('scoreLbl').textContent='Aciertos: '+score;
  document.getElementById('progress').style.width=((idx)/pool.length*100)+'%';
  document.getElementById('tema').textContent=q.temaLabel;
  document.getElementById('qtext').textContent=q.q;
  const ob=document.getElementById('opts');ob.innerHTML='';
  q._opts=shuffle(q.opts);
  q._opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='<span class="lt">'+'ABC'[i]+'</span>'+o;
    b.onclick=()=>choose(b,o,q);
    ob.appendChild(b);
  });
  const fb=document.getElementById('fb');fb.className='fb';fb.innerHTML='';
  document.getElementById('nextBtn').classList.add('hide');
}

function choose(btn,opt,q){
  if(answered)return;answered=true;
  const correct = opt===q.correct;
  if(correct)score++; else wrong.push(q);
  document.querySelectorAll('#opts .opt').forEach(b=>{
    b.disabled=true;
    const txt=b.textContent.replace(/^[ABC]/,'').trim();
    if(b.textContent.includes(q.correct)&&txt.endsWith(q.correct.slice(-12))) {}
  });
  // mark
  document.querySelectorAll('#opts .opt').forEach(b=>{
    const t=b.innerText.replace(/^[A-C]\s*/,'').trim();
    if(t===q.correct) b.classList.add('ok');
  });
  if(!correct) btn.classList.add('bad');
  const fb=document.getElementById('fb');
  fb.classList.add('show');
  fb.classList.add(correct?'good':'wrong');
  fb.innerHTML='<b>'+(correct?'✅ ¡Correcto!':'❌ Incorrecto')+'</b>'+
    (correct?'':'<div style="margin:4px 0"><b style="display:inline">Respuesta correcta:</b> '+q.correct+'</div>')+
    '<div class="small" style="margin-top:6px">'+q.temaLabel+'</div>'+
    '<div style="margin-top:6px">'+q.expl+'</div>';
  document.getElementById('scoreLbl').textContent='Aciertos: '+score;
  document.getElementById('nextBtn').classList.remove('hide');
}

function next(){
  idx++;
  if(idx>=pool.length){finish();return;}
  render();
}

function finish(){
  document.getElementById('progress').style.width='100%';
  const pct=Math.round(score/pool.length*100);
  document.getElementById('finalScore').textContent=score+' / '+pool.length;
  document.getElementById('finalPct').textContent=pct+'% de aciertos'+(pct>=70?' · ¡aprobado! 🎉':' · sigue repasando');
  const rev=document.getElementById('review');
  if(wrong.length){
    rev.innerHTML='<p style="font-weight:600;margin:16px 0 6px">Para repasar ('+wrong.length+'):</p>'+
      wrong.map(q=>'<div class="rev"><div class="qq">'+q.q+'</div><div style="color:#13632f;margin-top:3px">✔ '+q.correct+'</div><div class="small" style="margin-top:3px">'+q.expl+'</div></div>').join('');
  } else rev.innerHTML='<p class="center" style="color:#1e8e51;font-weight:600;margin-top:16px">¡Sin fallos! 🏆</p>';
  show('result');
}

// ---- desarrollo ----
let dpool=[],didx=0;
function startDev(){dpool=DATA.dev;didx=0;renderDev();show('devview');}
function renderDev(){
  const q=dpool[didx];
  document.getElementById('devCounter').textContent='Desarrollo '+(didx+1)+' / '+dpool.length;
  document.getElementById('devTema').textContent=q.temaLabel;
  document.getElementById('devQ').textContent=q.q;
  document.getElementById('devA').value='';
  const m=document.getElementById('devModel');m.classList.remove('show');
  m.innerHTML='<b>Respuesta modelo</b><div style="margin-top:6px">'+q.model+'</div>';
  document.getElementById('devNext').textContent = didx<dpool.length-1?'Siguiente →':'Terminar';
}
function devNext(){didx++;if(didx>=dpool.length){home();return;}renderDev();}
</script>

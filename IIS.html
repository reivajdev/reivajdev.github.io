<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test · Integración de Sistemas</title>
<style>
:root{--blue:#1f4e79;--mid:#2e75b6;--bg:#f4f6f9;--card:#fff;--ok:#1e8e51;--okbg:#e7f6ee;--bad:#c0392b;--badbg:#fdecea;--muted:#667;--line:#e3e8ee;--amber:#b9770e;--amberbg:#fdf3e3;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1c2530;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:18px}
header{text-align:center;padding:10px 0 4px}
header h1{font-size:20px;margin:0;color:var(--blue)}
header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.mbtn{background:var(--blue);color:#fff;padding:14px;font-weight:600;font-size:14px;transition:.15s;text-align:center}
.mbtn.sec{background:#eaf0f7;color:var(--blue)}
.mbtn:hover{filter:brightness(1.07)}
select{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);width:100%;background:#fff}
.bar{height:8px;background:#e9eef4;border-radius:6px;overflow:hidden;margin:2px 0 14px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--mid),var(--blue));width:0;transition:.3s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.badge{display:inline-block;background:#eaf0f7;color:var(--blue);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.amber{background:var(--amberbg);color:var(--amber)}
.q{font-size:17px;font-weight:600;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);padding:13px 15px;margin:8px 0;border-radius:10px;transition:.12s;font-size:14.5px}
.opt:hover{border-color:var(--mid);background:#f7fafd}
.opt .lt{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:#eef2f7;border-radius:50%;font-weight:700;font-size:12px;margin-right:9px;color:var(--blue)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#13632f}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:#8e261a}
.opt.bad .lt{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:13px 15px;border-radius:10px;font-size:14px;display:none}
.fb.show{display:block}
.fb.good{background:var(--okbg);border:1px solid #b8e2c8}
.fb.wrong{background:var(--badbg);border:1px solid #f3c3bc}
.fb b{display:block;margin-bottom:3px}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row button{padding:12px 18px;font-weight:600;font-size:14px}
.next{background:var(--blue);color:#fff}
.ghost{background:#eef2f7;color:var(--blue)}
.score{font-weight:700;color:var(--blue)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:vertical}
.model{margin-top:12px;padding:14px;background:#f3f7fb;border:1px solid #d8e6f3;border-radius:10px;font-size:14px;display:none;line-height:1.6}
.model.show{display:block}
.big{font-size:34px;font-weight:800;color:var(--blue);text-align:center;margin:6px 0}
.center{text-align:center}
.small{font-size:12.5px;color:var(--muted)}
.rev{font-size:13.5px;border-top:1px solid var(--line);padding:10px 0}
.rev .qq{font-weight:600}
.hide{display:none}
@media(max-width:520px){.modes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Test · Integración de Sistemas</h1>
    <p>Banco de exámenes UNIR 2020–2025 · respuesta oficial (2020–2022) y según temario (2024–2025)</p>
  </header>

  <div id="home" class="card">
    <p style="margin:0 0 12px;font-weight:600">Elige un modo de práctica</p>
    <div class="modes">
      <button class="mbtn" onclick="start('examen')">🎯 Simulacro examen<br><span class="small" style="color:#cfe0f3">15 preguntas aleatorias</span></button>
      <button class="mbtn" onclick="start('todas')">📚 Todas las preguntas<br><span class="small" style="color:#cfe0f3" id="cAll"></span></button>
      <button class="mbtn sec" onclick="start('aleatorio')">🔀 Aleatorio (20)<br><span class="small">repaso rápido</span></button>
      <button class="mbtn sec" onclick="document.getElementById('temaBox').classList.toggle('hide')">🗂️ Por tema<br><span class="small">elige uno</span></button>
    </div>
    <div id="temaBox" class="hide" style="margin-top:12px">
      <select id="temaSel"></select>
      <button class="mbtn" style="width:100%;margin-top:10px" onclick="start('tema')">Empezar tema</button>
    </div>
    <div style="margin-top:14px">
      <button class="mbtn sec" style="width:100%" onclick="start('dev')">✍️ Preguntas de desarrollo y práctica (con respuesta modelo)</button>
    </div>
    <p class="small" style="margin-top:14px">Sin penalización por fallo. Tras responder verás la respuesta correcta y la explicación basada en el temario.</p>
  </div>

  <div id="quiz" class="card hide">
    <div class="meta"><span id="counter"></span><span class="score" id="scoreLbl"></span></div>
    <div class="bar"><i id="progress"></i></div>
    <span class="badge" id="tema"></span> <span class="badge amber hide" id="srcb"></span>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="row">
      <button class="next hide" id="nextBtn" onclick="next()">Siguiente →</button>
      <button class="ghost" onclick="home()">Salir</button>
    </div>
  </div>

  <div id="devview" class="card hide">
    <div class="meta"><span id="devCounter"></span></div>
    <span class="badge" id="devTema"></span>
    <div class="q" id="devQ"></div>
    <textarea id="devA" placeholder="Escribe aquí tu respuesta y compárala con la respuesta modelo..."></textarea>
    <div class="row">
      <button class="next" onclick="document.getElementById('devModel').classList.add('show')">Ver respuesta modelo</button>
      <button class="ghost" id="devNext" onclick="devNext()">Siguiente →</button>
      <button class="ghost" onclick="home()">Salir</button>
    </div>
    <div class="model" id="devModel"></div>
  </div>

  <div id="result" class="card hide">
    <p class="center" style="font-weight:600;margin:0">Resultado</p>
    <div class="big" id="finalScore"></div>
    <p class="center small" id="finalPct"></p>
    <div id="review"></div>
    <div class="row" style="justify-content:center">
      <button class="next" onclick="home()">Volver al inicio</button>
    </div>
  </div>
</div>

<script>
const DATA = {"test": [{"q": "Si profundizamos en las dimensiones de los Sistemas de Información, la jerarquía y las funciones de negocio tienen que ver con la dimensión:", "opts": ["Tecnología", "Administración", "Organización", "Ninguna de las anteriores"], "correct": "Organización", "tema": 1, "temaLabel": "Tema 1 · Introducción a los SI", "expl": "La jerarquía y las funciones de negocio forman parte de la dimensión Organización del SI (junto con tecnología y administración)."}, {"q": "Con un SI podemos analizar el coste que supone comprar en el mercado o fabricar por sí misma. Este concepto es:", "opts": ["Teoría del coste de transacción", "Teoría de agencia", "Teoría de la calidad de la información", "Ninguna de las anteriores"], "correct": "Teoría del coste de transacción", "tema": 2, "temaLabel": "Tema 2 · Oportunidades y necesidades", "expl": "Analizar si comprar en el mercado o fabricar uno mismo es la teoría del coste de transacción (Coase). La plantilla oficial marcaba 'Ninguna', pero conceptualmente es esta: corregido."}, {"q": "En la clasificación clásica de SI, si trata grandes cantidades de datos externos e internos, es fácil de usar, muy gráfico y con análisis incorporado, se trata de:", "opts": ["MIS (información gerencial)", "TPS (transaccional)", "DSS (soporte a la decisión)", "EIS (información ejecutiva)"], "correct": "EIS (información ejecutiva)", "tema": 3, "temaLabel": "Tema 3 · Conceptos e integración", "expl": "Grandes volúmenes de datos internos y externos, muy gráfico y con análisis incorporado describe al EIS (información ejecutiva)."}, {"q": "En integración de sistemas, si son modulares integrables, no tienen por qué estar en operación pero hay una API que almacena la información que precisan, se trata de:", "opts": ["Ficheros transaccionales", "Paso de mensajes", "Middleware", "Ninguno de los anteriores"], "correct": "Middleware", "tema": 3, "temaLabel": "Tema 3 · Conceptos e integración", "expl": "Si existe una API que almacena la información y los sistemas no han de estar simultáneamente en operación, es middleware."}, {"q": "En los años 80, los sistemas integrados de gestión equivalían a los MRP II e incluían:", "opts": ["Gestión de la calidad", "Gestión de proyectos", "Marketing", "Recursos humanos"], "correct": "Marketing", "tema": 4, "temaLabel": "Tema 4 · ERP", "expl": "Los MRP II de los años 80 ampliaron el MRP incorporando áreas de gestión como el marketing."}, {"q": "Una adecuada gestión de la cadena de suministro permite ciertas ventajas. Señala la incorrecta:", "opts": ["Diferenciación", "Control de la cadena de valor", "Tener en cuenta cambios en paradigmas de productividad", "Aumentar el efecto látigo o bullwhip"], "correct": "Aumentar el efecto látigo o bullwhip", "tema": 5, "temaLabel": "Tema 5 · Cadena de suministro (SCM)", "expl": "Aumentar el efecto látigo (bullwhip) NO es una ventaja: es justo lo que una buena gestión de la cadena trata de evitar."}, {"q": "La relación entre los ingresos de un cliente, los gastos de darle servicio y la duración esperada de la relación se conoce como:", "opts": ["Valor de Tiempo de Vida del Cliente", "Tasa de Cancelación del Cliente", "Tasa de Cancelación de Vida del Cliente", "Todas son verdaderas"], "correct": "Valor de Tiempo de Vida del Cliente", "tema": 6, "temaLabel": "Tema 6 · Relaciones con clientes (CRM)", "expl": "Ingresos del cliente, menos el coste de servirle, por la duración esperada de la relación = Valor de Tiempo de Vida del Cliente (LTV)."}, {"q": "Aspectos como los estándares y la competitividad en los mercados, dentro de los criterios para la decisión de inversión, se relacionan con:", "opts": ["Calidad técnica", "Criterio económico", "Costes de cambio", "Ninguno de los anteriores"], "correct": "Costes de cambio", "tema": 9, "temaLabel": "Tema 9 · Inversión en TIC", "expl": "Los estándares y la competitividad en los mercados se relacionan con los costes de cambio (lock-in)."}, {"q": "Presentar procesos, aplicaciones y arquitectura para cubrir el denominado GAP se relaciona con la fase del plan de sistemas de:", "opts": ["Preparación y comprensión de la organización", "Estudio de la situación actual en SI/TI", "Formulación y construcción de escenarios", "Plan de acción"], "correct": "Formulación y construcción de escenarios", "tema": 8, "temaLabel": "Tema 8 · Planificación de SI", "expl": "Presentar procesos, aplicaciones y arquitectura para cubrir el GAP corresponde a la fase de formulación y construcción de escenarios."}, {"q": "En análisis de riesgos, el coste que supondría recuperarse de una incidencia determinada lo denominamos:", "opts": ["Activo", "Valor", "Impacto", "Riesgo"], "correct": "Valor", "tema": 12, "temaLabel": "Tema 12 · Seguridad (MAGERIT)", "expl": "El coste de recuperarse de una incidencia es el Valor del activo (valorar = coste de reposición)."}, {"q": "En el EVS, la valoración de riesgos y el análisis coste/beneficio se realiza en:", "opts": ["EVS4 Estudio de alternativas de solución", "EVS2 Estudio de la situación actual", "EVS3 Definición de requisitos", "EVS5 Valoración de alternativas"], "correct": "EVS5 Valoración de alternativas", "tema": 10, "temaLabel": "Tema 10 · Viabilidad (EVS)", "expl": "La valoración de riesgos y el análisis coste/beneficio se realizan en EVS5 (valoración de alternativas)."}, {"q": "El valor esperado monetario:", "opts": ["Es el sumatorio de la renta esperada de cada alternativa multiplicada por su probabilidad", "Es el cociente del beneficio menos la inversión dividido por la inversión", "Es la relación entre la inversión y los beneficios generados", "Ninguna de las anteriores"], "correct": "Es el sumatorio de la renta esperada de cada alternativa multiplicada por su probabilidad", "tema": 11, "temaLabel": "Tema 11 · Aspectos financieros", "expl": "El Valor Esperado Monetario es el sumatorio de la renta esperada de cada alternativa multiplicada por su probabilidad."}, {"q": "En BI, el proceso analítico en línea para organización y consulta de datos sobre una estructura multidimensional se corresponde con:", "opts": ["Data Warehouse", "ETL", "OLAP", "Cuadro de mando"], "correct": "OLAP", "tema": 7, "temaLabel": "Tema 7 · Business Intelligence", "expl": "El procesamiento analítico en línea, multidimensional y sobre cubos, es OLAP."}, {"q": "¿Cuál es el principal objetivo del proceso de Análisis del Sistema de Información (ASI)?", "opts": ["Una especificación detallada para un plan de pruebas completo", "Una especificación detallada que satisfaga las necesidades de los usuarios y sirva de base al diseño", "La valoración de alternativas y especificación de requisitos", "Revisar la planificación inicial y obtener los requisitos iniciales"], "correct": "Una especificación detallada que satisfaga las necesidades de los usuarios y sirva de base al diseño", "tema": 13, "temaLabel": "Tema 13 · Métrica v.3", "expl": "El objetivo del Análisis del SI (ASI) es una especificación detallada que satisfaga a los usuarios y sirva de base al diseño."}, {"q": "El sistema integrado de gestión pionero en bases de datos relacionales, con una opción sólida en gestión de operaciones financieras:", "opts": ["SAP", "ORACLE", "Microsoft Dynamics", "Salesforce"], "correct": "ORACLE", "tema": 4, "temaLabel": "Tema 4 · ERP", "expl": "El ERP pionero en bases de datos relacionales y fuerte en operaciones financieras es ORACLE."}, {"q": "Si un SI nos permite usar datos internos y externos y abandonar planteamientos preconcebidos, estratégicamente se relaciona con:", "opts": ["Intimidad con clientes y proveedores", "Toma de decisiones mejorada", "Diferenciación del producto", "Nuevos productos, servicios y modelos de negocio"], "correct": "Toma de decisiones mejorada", "tema": 1, "temaLabel": "Tema 1 · Introducción a los SI", "expl": "Usar datos internos y externos y abandonar planteamientos preconcebidos se asocia a la toma de decisiones mejorada."}, {"q": "Respecto a las estrategias de los SI para lidiar con las fuerzas competitivas, señala la única correcta de las presentadas:", "opts": ["Liderazgo por alto coste", "Enfoque a nichos de mercado", "Debilitar proveedores", "Igualación de productos"], "correct": "Enfoque a nichos de mercado", "tema": 2, "temaLabel": "Tema 2 · Oportunidades y necesidades", "expl": "Entre las estrategias competitivas válidas frente a las fuerzas del mercado está el enfoque a nichos de mercado."}, {"q": "Elementos fundamentales dados por supuestos en las organizaciones, muchas veces incuestionables, que chocan con la integración del SI, tienen que ver con:", "opts": ["Rutinas", "Cultura", "Procesos de negocio", "Todas son correctas"], "correct": "Cultura", "tema": 3, "temaLabel": "Tema 3 · Conceptos e integración", "expl": "Los elementos dados por supuestos e incuestionables que chocan con la integración son, sobre todo, la cultura."}, {"q": "En la clasificación clásica de SI, si se trata de información rutinaria con grandes cantidades de datos, normalmente de la propia empresa, se trata de:", "opts": ["MIS (información gerencial)", "TPS (transaccional)", "DSS (soporte a la decisión)", "ES (sistemas expertos)"], "correct": "TPS (transaccional)", "tema": 3, "temaLabel": "Tema 3 · Conceptos e integración", "expl": "Información rutinaria con grandes cantidades de datos, normalmente de la propia empresa = TPS (transaccional)."}, {"q": "En integración de sistemas, si son modulares integrables que han de estar en modo operación sin un dispositivo de almacenamiento, se trata de:", "opts": ["Ficheros transaccionales", "Paso de mensajes", "Middleware", "Arquitectura orientada a servicios"], "correct": "Paso de mensajes", "tema": 3, "temaLabel": "Tema 3 · Conceptos e integración", "expl": "Sistemas modulares que han de estar en operación y sin dispositivo de almacenamiento intermedio = paso de mensajes."}, {"q": "El origen de los sistemas integrados de gestión, en los años 60, está relacionado con:", "opts": ["MRP para listados de materiales y gestión del inventario", "MRP para gestión de recursos humanos", "MRP para distribución y transporte", "MRP para aspectos de calidad"], "correct": "MRP para listados de materiales y gestión del inventario", "tema": 4, "temaLabel": "Tema 4 · ERP", "expl": "El origen del ERP, en los años 60, fue el MRP para listados de materiales y gestión del inventario."}, {"q": "La adecuada gestión de la cadena de suministro con integración de SI supone… señala la respuesta falsa:", "opts": ["Mejora del servicio al cliente", "Aumento de la edad media del producto servido", "Reducción de las ventas perdidas", "Reducción de costes por obsolescencia"], "correct": "Aumento de la edad media del producto servido", "tema": 5, "temaLabel": "Tema 5 · Cadena de suministro (SCM)", "expl": "Es falsa: una buena cadena de suministro reduce (no aumenta) la edad media del producto servido."}, {"q": "El soporte técnico y Help Desk, en los sistemas de relación con clientes (CRM), se relaciona con:", "opts": ["CRM analítico", "CRM operacional", "CRM relacional", "CRM principal"], "correct": "CRM operacional", "tema": 6, "temaLabel": "Tema 6 · Relaciones con clientes (CRM)", "expl": "El soporte técnico y el Help Desk corresponden al CRM operacional."}, {"q": "Si el responsable decide implantar un sistema muy extendido en el mercado en lugar de uno especializado, para convertirse en experto en dicho sistema, incurre en:", "opts": ["Problemas de agencia", "Comportamiento de manada", "Cambio de paradigma", "Ninguna de las anteriores"], "correct": "Comportamiento de manada", "tema": 9, "temaLabel": "Tema 9 · Inversión en TIC", "expl": "Elegir un sistema muy extendido para no quedarse fuera de lo que hace el mercado es comportamiento de manada."}, {"q": "La creciente autonomía de los usuarios o la mejora en el seguimiento de proyectos justifica la planificación desde el punto de vista de:", "opts": ["Tecnología", "Diferenciación", "Costes", "Ninguna de las anteriores"], "correct": "Tecnología", "tema": 8, "temaLabel": "Tema 8 · Planificación de SI", "expl": "La creciente autonomía de los usuarios y la mejora del seguimiento de proyectos justifican la planificación desde la perspectiva de la tecnología."}, {"q": "En análisis de riesgos, el componente de un SI susceptible de ser atacado con consecuencias para la organización se denomina:", "opts": ["Valor", "Riesgo", "Amenaza", "Activo"], "correct": "Activo", "tema": 12, "temaLabel": "Tema 12 · Seguridad (MAGERIT)", "expl": "El componente del SI susceptible de ser atacado se denomina activo."}, {"q": "En el EVS, la descomposición inicial en subsistemas y la preselección de soluciones se corresponde con:", "opts": ["EVS1 Establecimiento del alcance", "EVS4 Estudio de alternativas de solución", "EVS3 Definición de requisitos", "EVS2 Estudio de la situación actual"], "correct": "EVS4 Estudio de alternativas de solución", "tema": 10, "temaLabel": "Tema 10 · Viabilidad (EVS)", "expl": "La descomposición inicial en subsistemas y la preselección de soluciones corresponde a EVS4 (estudio de alternativas)."}, {"q": "Profundizando en la estructura de costes según las condiciones económicas y financieras, señala la incorrecta:", "opts": ["Tratamos de reducir al máximo los costes ocultos", "Estimamos los costes desde un nivel alto (Top-up)", "Estimamos los costes a partir de criterios por unidad (Bottom-up)", "Estimamos los costes desde un nivel macro (Top-down)"], "correct": "Estimamos los costes desde un nivel alto (Top-up)", "tema": 11, "temaLabel": "Tema 11 · Aspectos financieros", "expl": "Es incorrecta porque no existe 'Top-up': los enfoques de estimación son Top-down y Bottom-up."}, {"q": "En BI, la documentación mediante la cual se presentan los resultados de uno o varios procesos de negocio se corresponde con:", "opts": ["Informes", "ETL", "OLAP", "Cuadro de mando"], "correct": "Informes", "tema": 7, "temaLabel": "Tema 7 · Business Intelligence", "expl": "La documentación que presenta los resultados de uno o varios procesos de negocio son los informes."}, {"q": "El mantenimiento del SI se realiza siempre después de la fase de implantación y aceptación:", "opts": ["Falsa, solo si se ha contratado", "Verdadera, según acuerdo de nivel de servicio", "Falsa, se solapa con la fase de implantación", "Verdadera, es preceptivo por ley el mantenimiento correctivo"], "correct": "Falsa, solo si se ha contratado", "tema": 13, "temaLabel": "Tema 13 · Métrica v.3", "expl": "Según la plantilla oficial, es falsa salvo que se haya contratado el mantenimiento."}, {"q": "En el impacto económico de los SI, según la teoría del coste de transacción:", "opts": ["La TI puede reducir el coste de participación en el mercado facilitando la contratación de proveedores externos", "La TI permite aumentar tamaño y número de empleados porque es más costoso reducirlo", "La TI disminuye la externalización aumentando la manufactura propia", "Ninguna de las anteriores"], "correct": "La TI puede reducir el coste de participación en el mercado facilitando la contratación de proveedores externos", "tema": 2, "temaLabel": "Tema 2 · Oportunidades y necesidades", "expl": "Según la teoría del coste de transacción, la TI reduce el coste de participar en el mercado y facilita externalizar."}, {"q": "Los SI y el aumento de la eficiencia y los estándares tienen que ver especialmente con la característica de la organización:", "opts": ["Entornos organizacionales", "Cultura", "Políticas", "Procesos de negocio"], "correct": "Procesos de negocio", "tema": 2, "temaLabel": "Tema 2 · Oportunidades y necesidades", "expl": "El aumento de la eficiencia y de los estándares se asocia a los procesos de negocio de la organización."}, {"q": "Elementos de tipo alfanumérico que describen eventos, actividades o transacciones son:", "opts": ["Datos", "Información", "Conocimiento", "Sistemas de información"], "correct": "Datos", "tema": 1, "temaLabel": "Tema 1 · Introducción a los SI", "expl": "Elementos alfanuméricos que describen eventos, actividades o transacciones son los temaLabel": "Tema 11 · Aspectos financieros", "expl": "En el flujo de caja no se computan los costes amortizables, porque la amortización no es una salida real de tesorería.", "src": "según temario"}, {"q": "En Business Intelligence (BI), la herramienta que informa de la evolución de los parámetros fundamentales de negocio de una organización es:", "opts": ["Informes", "ETL", "OLAP", "Cuadro de mando"], "correct": "Cuadro de mando", "tema": 7, "temaLabel": "Tema 7 · Business Intelligence", "expl": "El cuadro de mando (dashboard) informa de la evolución de los parámetros fundamentales del negocio.", "src": "según temario"}, {"q": "El catálogo de requisitos detallado que describe con precisión el SI y sirve para comprobar la especificación de los modelos se realiza en:", "opts": ["ASI 1 Definición del sistema", "ASI 2 Establecimiento de requisitos", "ASI 3 Identificación de subsistemas de análisis", "ASI 6 Elaboración del modelo de datos"], "correct": "ASI 2 Establecimiento de requisitos", "tema": 13, "temaLabel": "Tema 13 · Métrica v.3", "expl": "El catálogo de requisitos detallado se elabora en ASI 2 (Establecimiento de requisitos).", "src": "según temario"}, {"q": "En ASI 1 (Definición del sistema) la definición inicial del SI se lleva a cabo:", "opts": ["Representando la información mediante modelos de bajo nivel", "Mediante un catálogo de requisitos específicos", "Delimitando el alcance del sistema", "Mediante la representación del modelo de datos"], "correct": "Delimitando el alcance del sistema", "tema": 13, "temaLabel": "Tema 13 · Métrica v.3", "expl": "En ASI 1 (Definición del sistema) se delimita el alcance del sistema.", "src": "según temario"}, {"q": "Las etapas del análisis de riesgos son:", "opts": ["Análisis y valoración de activos, análisis de impacto y análisis de riesgos", "Análisis y cuantificación de riesgos y diseño de sistemas de protección", "Catálogo de requisitos de seguridad, estudio de viabilidad y cálculo de riesgos", "Análisis de activos, valoración de riesgos y análisis de impacto"], "correct": "Análisis y valoración de activos, análisis de impacto y análisis de riesgos", "tema": 12, "temaLabel": "Tema 12 · Seguridad (MAGERIT)", "expl": "Las etapas son: análisis y valoración de activos, análisis de impacto y análisis de riesgos.", "src": "según temario"}, {"q": "Comparar lo necesitado con lo que se tiene (GAP), marcando el punto de partida, se relaciona con la fase del plan de sistemas de:", "opts": ["Preparación y comprensión de la organización", "Estudio de la situación actual en SI/TI", "Formulación y construcción de escenarios", "Plan de acción"], "correct": "Estudio de la situación actual en SI/TI", "tema": 8, "temaLabel": "Tema 8 · Planificación de SI", "expl": "Comparar necesidades y situación como punto de partida es el estudio de la situación actual en SI/TI.", "src": "según temario"}, {"q": "En la integración de sistemas mediante ficheros transaccionales, señala la correcta:", "opts": ["Es preciso controlar la inexistencia o corrupción del fichero", "La integración se realiza siempre en un único sentido", "Es el tipo de integración más rápido", "Todas son falsas"], "correct": "Es preciso controlar la inexistencia o corrupción del fichero", "tema": 3, "temaLabel": "Tema 3 · Conceptos e integración", "expl": "En ficheros transaccionales es preciso controlar la inexistencia o corrupción del fichero; además es la integración más lenta.", "src": "según temario"}, {"q": "Los sistemas de soporte a la decisión (DSS):", "opts": ["Son difíciles de utilizar por los usuarios", "No utilizan herramientas de modelización y análisis", "Dan soporte a decisiones que no se pueden predecir con antelación", "Solo sirven para decisiones rutinarias"], "correct": "Dan soporte a decisiones que no se pueden predecir con antelación", "tema": 3, "temaLabel": "Tema 3 · Conceptos e integración", "expl": "El DSS da soporte a decisiones que no se pueden predecir con antelación.", "src": "según temario"}, {"q": "En la cadena de suministro, ¿cuál NO es una afirmación verdadera?", "opts": ["Proveedores: principio de la cadena de suministro", "Producción: última parte en las redes de suministro", "Distribución: logística, transporte y entrega", "Clientes: consumidores finales"], "correct": "Producción: última parte en las redes de suministro", "tema": 5, "temaLabel": "Tema 5 · Cadena de suministro (SCM)", "expl": "Es falsa: la producción no es la última parte; son los clientes quienes cierran la cadena.", "src": "según temario"}, {"q": "Una estructura con distintos niveles o áreas, división de funciones y una jerarquía establecida se corresponde con:", "opts": ["Tecnología de la información", "Administración", "Organizaciones", "Modelos de negocio"], "correct": "Organizaciones", "tema": 1, "temaLabel": "Tema 1 · Introducción a los SI", "expl": "Personas, estructura, división de funciones y jerarquía describen la dimensión Organizaciones.", "src": "según temario"}, {"q": "La especificación inicial del alcance, los objetivos y los requisitos generales corresponde a la actividad del EVS:", "opts": ["Estudio de la Situación Actual", "Valoración de las Alternativas", "Definición de Requisitos", "Establecimiento del alcance del sistema"], "correct": "Establecimiento del alcance del sistema", "tema": 10, "temaLabel": "Tema 10 · Viabilidad (EVS)", "expl": "El establecimiento del alcance del sistema es la primera actividad del EVS (EVS1).", "src": "según temario"}, {"q": "El impacto que se calcula teniendo en cuenta el valor propio del activo y las amenazas de los activos de los que depende es el:", "opts": ["Impacto repercutido", "Impacto acumulado", "Riesgo residual", "Impacto potencial"], "correct": "Impacto repercutido", "tema": 12, "temaLabel": "Tema 12 · Seguridad (MAGERIT)", "expl": "El impacto que considera el valor propio y las amenazas de los activos de los que depende es el impacto repercutido.", "src": "según temario"}, {"q": "En Business Intelligence, los procesos de extraer, transformar y cargar los datos en el almacén se denominan:", "opts": ["Informes", "Procesos ETL", "OLAP", "Cuadro de mando"], "correct": "Procesos ETL", "tema": 7, "temaLabel": "Tema 7 · Business Intelligence", "expl": "Extraer, transformar y cargar son los procesos ETL.", "src": "según temario"}, {"q": "El orden correcto de la aproximación metódica del análisis de riesgos (MAGERIT) es:", "opts": ["Determinar riesgo, activos, amenazas e impacto", "Determinar impacto, activos, amenazas y riesgo", "Determinar amenazas, activos, impacto y riesgo", "Determinar los activos, las amenazas, el impacto y el riesgo"], "correct": "Determinar los activos, las amenazas, el impacto y el riesgo", "tema": 12, "temaLabel": "Tema 12 · Seguridad (MAGERIT)", "expl": "El orden metódico es: determinar activos, amenazas, impacto y riesgo.", "src": "según temario"}, {"q": "Una sucesión de flujos de tesorería e inversiones descontados a una tasa r a lo largo de t periodos define:", "opts": ["VEM Valor Esperado Monetario", "TIN Tipo de Interés Nominal", "TAE Tasa Anual Equivalente", "VAN Valor Actual Neto"], "correct": "VAN Valor Actual Neto", "tema": 11, "temaLabel": "Tema 11 · Aspectos financieros", "expl": "Los flujos de tesorería descontados a una tasa r durante t periodos definen el VAN.", "src": "según temario"}, {"q": "Es el sumatorio de la renta que se espera obtener en cada alternativa multiplicada por la probabilidad de que se produzca:", "opts": ["VAN Valor Actual Neto", "TIR Tasa Interna de Retorno", "RP Rentabilidad Prevista", "VEM Valor Esperado Monetario"], "correct": "VEM Valor Esperado Monetario", "tema": 11, "temaLabel": "Tema 11 · Aspectos financieros", "expl": "El sumatorio de la renta esperada por su probabilidad es el VEM.", "src": "según temario"}, {"q": "Respecto al Modelo de Cadena de Valor de Porter:", "opts": ["Los SI se relacionan con la infraestructura de la empresa, los RRHH, la logística o el marketing, entre otros", "Los SI se relacionan únicamente con las actividades de apoyo", "Los SI se relacionan únicamente con las actividades primarias", "Los SI se relacionan únicamente con las actividades de soporte"], "correct": "Los SI se relacionan con la infraestructura de la empresa, los RRHH, la logística o el marketing, entre otros", "tema": 2, "temaLabel": "Tema 2 · Oportunidades y necesidades", "expl": "En la cadena de valor de Porter los SI se relacionan con infraestructura, RRHH, logística o marketing, entre otros.", "src": "según temario"}, {"q": "¿Qué significan las siglas MAGERIT?", "opts": ["Metodología de Activos y Riesgos en el campo de las TIC", "Metodología de Análisis y Gestión de Riesgos elaborada por el Consejo Superior de Administración Electrónica", "Metodología Adaptada al Registro y Gestión de Riesgos IT", "Management of Risks for Enterprises that Generates IT"], "correct": "Metodología de Análisis y Gestión de Riesgos elaborada por el Consejo Superior de Administración Electrónica", "tema": 12, "temaLabel": "Tema 12 · Seguridad (MAGERIT)", "expl": "MAGERIT = Metodología de Análisis y Gestión de Riesgos, del Consejo Superior de Administración Electrónica.", "src": "según temario"}, {"q": "En la Definición de Requisitos (EVS 3) se analiza la información obtenida definiendo los requisitos y sus prioridades, que se añaden al catálogo de requisitos:", "opts": ["Es falso", "Es verdadero", "Depende del tipo de solicitud del cliente", "Depende de los resultados del estudio de la situación actual"], "correct": "Es verdadero", "tema": 10, "temaLabel": "Tema 10 · Viabilidad (EVS)", "expl": "Verdadero: en EVS3 se definen los requisitos y sus prioridades y se añaden al catálogo.", "src": "según temario"}, {"q": "¿Cuál de los siguientes se utiliza como indicador de rentabilidad de la inversión?", "opts": ["ROI Retorno sobre la Inversión", "VAN Valor Actual Neto", "VEM Valor Esperado Monetario", "Todas son correctas"], "correct": "Todas son correctas", "tema": 11, "temaLabel": "Tema 11 · Aspectos financieros", "expl": "ROI, VAN y VEM son todos indicadores de rentabilidad de la inversión.", "src": "según temario"}, {"q": "El diseño de la red de distribución y la localización de almacenes en la cadena de suministro es una decisión de tipo:", "opts": ["Estratégico", "Táctico", "Operativo", "De ejecución"], "correct": "Estratégico", "tema": 5, "temaLabel": "Tema 5 · Cadena de suministro (SCM)", "expl": "La localización de almacenes y el diseño de la red son decisiones estratégicas de la cadena.", "src": "según temario"}], "dev": [{"q": "Elabora un informe para la dirección sobre la conveniencia de implantar un sistema integrado de gestión (ERP): explica qué es, las ventajas e inconvenientes de desarrollo propio frente a adquisición de un paquete, los factores de éxito y los principales proveedores.", "tema": 4, "temaLabel": "Tema 4 · ERP", "model": "Un ERP integra los módulos de la empresa (compras, almacén, producción, ventas, finanzas, RRHH) sobre una ÚNICA base de datos: el dato se introduce una sola vez, tiene un responsable, permisos, respaldo e historial. DESARROLLO PROPIO: máxima adaptación y mantiene la metodología propia, pero es lento, caro de desarrollar, exige experiencia, resulta rígido y su mantenimiento es costoso en entornos cambiantes. PAQUETE ERP: instalación rápida, incorpora buenas prácticas y experiencias previas, pero con licencias caras, costes de parametrización variables e imposición de procesos estándar (ventaja e inconveniente). BENEFICIOS: control de la actividad, aceleración de procesos, menos inventarios y duplicidades, mejor time-to-market, mejor servicio al cliente y comunicación interna. FACTORES DE ÉXITO: alineamiento procesos-ERP, implicación de la dirección, buen equipo, selección/gestión de consultores, metodología de implantación, formación de usuarios y mejora continua. PROVEEDORES: SAP (líder, por sectores, Business One para pymes), ORACLE (pionera en BD relacionales, fuerte en finanzas, nube) y Microsoft Dynamics (NAV para pymes, AX para grandes). RECOMENDACIÓN: en una pyme con procesos estándar, paquete; con procesos muy singulares y recursos, valorar desarrollo o solución mixta."}, {"q": "Describe la metodología MAGERIT: su finalidad, las fases del análisis de riesgos, los elementos que maneja (activo, amenaza, degradación, probabilidad, impacto, riesgo) y el papel de las salvaguardas. Pon ejemplos de salvaguardas.", "tema": 12, "temaLabel": "Tema 12 · Seguridad (MAGERIT)", "model": "MAGERIT es la metodología de análisis y gestión de riesgos del Consejo Superior de Administración Electrónica; considera la gestión del riesgo pieza clave del buen gobierno. APROXIMACIÓN METÓDICA: determinar activos → amenazas → salvaguardas y su eficacia → estimar impacto → estimar riesgo. ELEMENTOS: ACTIVO = componente del SI susceptible de ataque (información, datos, servicios, software, hardware, comunicaciones, recursos), valorado en cinco dimensiones (Confidencialidad, Integridad, Disponibilidad, Autenticidad, Trazabilidad). AMENAZA = causa potencial de incidente (natural, del entorno, defectos de aplicaciones, humana accidental o deliberada). DEGRADACIÓN = fracción del valor que se perdería. PROBABILIDAD/FRECUENCIA = cómo de probable es la materialización. IMPACTO = daño sobre el activo (acumulado o repercutido). RIESGO = impacto × probabilidad. SALVAGUARDAS: reducen la probabilidad y/o limitan el daño, dando impacto y riesgo RESIDUALES; ejemplos: copias de seguridad, redundancia, cifrado, control de accesos, monitorización, SAI, plan de recuperación, formación. Es un proceso ITERATIVO y se concreta en un Plan de Seguridad (PS1 identificación de proyectos, PS2 plan de ejecución, PS3 ejecución)."}, {"q": "Explica el Estudio de Viabilidad del Sistema (EVS) de Métrica v.3: su objetivo, los criterios que valora, sus seis fases y algunas técnicas empleadas.", "tema": 10, "temaLabel": "Tema 10 · Viabilidad (EVS)", "model": "El EVS analiza un conjunto de necesidades y propone una solución valorándola con criterios económicos, técnicos, legales y operativos; las alternativas pueden ser a medida, de producto del mercado o mixtas. FASES: EVS1 Establecimiento del alcance (objetivos, requisitos iniciales, unidades afectadas); EVS2 Estudio de la situación actual (sistemas existentes); EVS3 Definición de requisitos (catálogo de requisitos); EVS4 Estudio de alternativas (preselección y descripción técnica); EVS5 Valoración de alternativas (estudio de la inversión, coste/beneficio, riesgos y planificación); EVS6 Selección de la solución (evaluación, elección y aprobación). TÉCNICAS: catálogo de requisitos, entrevistas y reuniones, sesiones JAD (con usuarios) y JRP (con alta dirección), matrices NxM para trazabilidad, análisis coste/beneficio (con punto y periodo de amortización y ROI) y factores críticos de éxito."}, {"q": "Desarrolla qué es un Plan de Sistemas de Información: desde qué perspectivas se justifica, sus fases de elaboración y quiénes participan.", "tema": 8, "temaLabel": "Tema 8 · Planificación de SI", "model": "El Plan de SI es el instrumento que define las bases de los futuros SI a partir de la situación actual y de los objetivos; es una herramienta viva que requiere seguimiento. SE JUSTIFICA desde tres perspectivas: tecnología (productividad), reducción de costes (competitividad y supervivencia) y diferenciación; cuidado con la paradoja de la productividad. FASES: (1) preparación y comprensión de la organización (lanzamiento, conocimiento de la empresa y su entorno); (2) estudio de la situación actual y balance de necesidades, comparando lo necesario con lo existente (análisis GAP); (3) formulación y construcción de escenarios, con procesos, aplicaciones y arquitectura que cubran el GAP; (4) plan de acción e implantación, con calendario, prioridades, dependencias y gestión del cambio; después, seguimiento y actualización. PARTICIPAN: comité informático, equipo de proyecto, consultores internos/externos, expertos y grupos de usuarios."}, {"q": "Explica qué es el Business Intelligence y su arquitectura: Data Warehouse, ETL, OLAP, cuadros de mando e informes.", "tema": 7, "temaLabel": "Tema 7 · Business Intelligence", "model": "El BI es el conjunto de metodologías, aplicaciones y capacidades para transformar datos en información y conocimiento que permita decidir mejor; es evolución de los DSS. DATA WAREHOUSE: almacén organizado por temas, integrado, no volátil y variable en el tiempo; elementos: tablas de hecho (medidas), dimensiones y métricas; esquemas en estrella o copo de nieve. ETL (extraer, transformar, cargar): integra datos estructurados, semiestructurados y no estructurados en el almacén. OLAP: análisis multidimensional sobre cubos (MOLAP, ROLAP, HOLAP). Por encima: cuadros de mando/dashboards, informes (estáticos, ad hoc, paramétricos), minería de datos y análisis predictivo. Conviene distinguir BI, Business Analytics y Big Data."}, {"q": "Explica la gestión de la cadena de suministro (SCM): qué actores intervienen, la variable fundamental, la evolución de push a pull y el papel de los sistemas de información.", "tema": 5, "temaLabel": "Tema 5 · Cadena de suministro (SCM)", "model": "La cadena de suministro conecta proveedores, departamento de producción, distribuidores y clientes; la variable fundamental que la rige es el TIEMPO (llevar el producto al mercado en tiempo y forma). A partir de la demanda real o estimada se calcula la producción, las materias primas y la distribución. EVOLUCIÓN: del almacenamiento masivo (push) a sistemas pull guiados por la demanda, con foco en optimizar, integrar, colaborar y sincronizar. PAPEL DE LOS SI: dar visibilidad de extremo a extremo, planificar la demanda y coordinar a los actores; hay soluciones SCM específicas y módulos integrados en el ERP. Conceptos asociados: logística inversa y sostenibilidad de la cadena (centro de valor, no solo de coste)."}, {"q": "PRÁCTICA · Árbol de decisión. Una empresa decide entre IMPLANTAR un ERP o NO. Implantar: 65% de éxito técnico; con éxito, adopción alta (70%, +200) o media (30%, +100); sin éxito pleno (35%), parcial (40%, +30) o fracaso (60%, −100). No implantar: 50% mejoras parciales —estabiliza (60%, +40) o se mantiene (40%, +10)— y 50% sin mejorar —pérdida moderada (55%, −40) o grave (45%, −120)—. ¿Qué decisión conviene?", "tema": 9, "temaLabel": "Tema 9 · Inversión en TIC (práctica)", "model": "Se resuelve de derecha a izquierda con Valor Esperado = Σ(probabilidad × resultado). IMPLANTAR: éxito → 0,70·200 + 0,30·100 = 170; sin éxito pleno → 0,40·30 + 0,60·(−100) = −48; valor de implantar = 0,65·170 + 0,35·(−48) = 110,5 − 16,8 = 93,7 UM. NO IMPLANTAR: mejoras → 0,60·40 + 0,40·10 = 28; sin mejorar → 0,55·(−40) + 0,45·(−120) = −76; valor = 0,50·28 + 0,50·(−76) = −24 UM. DECISIÓN: IMPLANTAR el ERP, porque 93,7 UM > −24 UM."}, {"q": "PRÁCTICA · Análisis de riesgos (MAGERIT). Activo A = 500.000 €, degradación 90%, frecuencia 0,1/año. Salvaguardas: 90% de eficacia sobre el impacto y 50% sobre la frecuencia. Activo B = 100.000 €, depende de A en un 30%. Calcula impacto, riesgo, residuales e impacto repercutido en B.", "tema": 12, "temaLabel": "Tema 12 · Seguridad (práctica)", "model": "Impacto potencial en A = 500.000 × 0,90 = 450.000 €. Riesgo potencial = 450.000 × 0,1 = 45.000 €/año. Impacto residual = 450.000 × (1 − 0,90) = 45.000 €. Frecuencia residual = 0,1 × (1 − 0,50) = 0,05/año. Riesgo residual = 45.000 × 0,05 = 2.250 €/año. Impacto repercutido en B = 100.000 × 0,90 × 0,30 = 27.000 €. Las salvaguardas reducen la pérdida anual esperada de 45.000 € a 2.250 € (−90%)."}, {"q": "PRÁCTICA · VAN y payback. Proyecto A (CRM): inversión 30.000, primer flujo 9.000, crecimiento 4% anual, tasa 8%, 5 años. Proyecto B (BI): inversión 25.000, primer flujo 7.000, crecimiento 7%, tasa 8%, 5 años. Calcula el VAN y di cuál conviene.", "tema": 11, "temaLabel": "Tema 11 · Aspectos financieros (práctica)", "model": "Flujos con FTt = FT1·(1+g)^(t−1), descontados entre 1,08^t. PROYECTO A — valores actuales: 8.333 + 8.025 + 7.727 + 7.442 + 7.166 = 38.693; VAN = −30.000 + 38.693 = +8.693 UM. PROYECTO B — valores actuales: 6.481 + 6.421 + 6.362 + 6.303 + 6.245 = 31.812; VAN = −25.000 + 31.812 = +6.812 UM. Ambos son rentables (VAN > 0) y recuperan la inversión durante el año 4 (payback ≈ 3,2 y 3,3 años). Si solo cabe uno, por mayor creación de valor se elige A."}]};

(function(){
  document.getElementById('cAll').textContent = DATA.test.length + ' preguntas';
  const temas=[...new Set(DATA.test.map(q=>q.tema))].sort((a,b)=>a-b);
  const sel=document.getElementById('temaSel');
  temas.forEach(t=>{
    const n=DATA.test.filter(q=>q.tema===t).length;
    const lbl=DATA.test.find(q=>q.tema===t).temaLabel;
    const o=document.createElement('option');o.value=t;o.textContent=lbl+' ('+n+')';sel.appendChild(o);
  });
})();
function show(id){['home','quiz','devview','result'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide');window.scrollTo(0,0);}
function home(){show('home');}
function start(mode){
  if(mode==='dev'){startDev();return;}
  let qs=DATA.test;
  if(mode==='examen') pool=shuffle(qs).slice(0,Math.min(15,qs.length));
  else if(mode==='aleatorio') pool=shuffle(qs).slice(0,20);
  else if(mode==='tema'){const t=+document.getElementById('temaSel').value;pool=shuffle(qs.filter(q=>q.tema===t));}
  else pool=shuffle(qs);
  idx=0;score=0;wrong=[];render();show('quiz');
}
function render(){
  answered=false;
  const q=pool[idx];
  document.getElementById('counter').textContent='Pregunta '+(idx+1)+' / '+pool.length;
  document.getElementById('scoreLbl').textContent='Aciertos: '+score;
  document.getElementById('progress').style.width=((idx)/pool.length*100)+'%';
  document.getElementById('tema').textContent=q.temaLabel;
  var sb=document.getElementById('srcb');if(q.src){sb.textContent=q.src;sb.classList.remove('hide');}else{sb.classList.add('hide');}
  document.getElementById('qtext').textContent=q.q;
  const ob=document.getElementById('opts');ob.innerHTML='';
  const order=shuffle(q.opts);
  order.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='<span class="lt">'+'ABCD'[i]+'</span>'+o;
    b.onclick=()=>choose(b,o,q);
    ob.appendChild(b);
  });
  const fb=document.getElementById('fb');fb.className='fb';fb.innerHTML='';
  document.getElementById('nextBtn').classList.add('hide');
}
function choose(btn,opt,q){
  if(answered)return;answered=true;
  const correct = opt===q.correct;
  if(correct)score++; else wrong.push(q);
  document.querySelectorAll('#opts .opt').forEach(b=>{
    b.disabled=true;
    const t=b.innerText.replace(/^[A-D]\s*/,'').trim();
    if(t===q.correct) b.classList.add('ok');
  });
  if(!correct) btn.classList.add('bad');
  const fb=document.getElementById('fb');
  fb.classList.add('show');fb.classList.add(correct?'good':'wrong');
  fb.innerHTML='<b>'+(correct?'✅ ¡Correcto!':'❌ Incorrecto')+'</b>'+
    (correct?'':'<div style="margin:4px 0"><b style="display:inline">Respuesta correcta:</b> '+q.correct+'</div>')+
    '<div>'+q.expl+'</div>';
  document.getElementById('scoreLbl').textContent='Aciertos: '+score;
  document.getElementById('nextBtn').classList.remove('hide');
}
function next(){idx++;if(idx>=pool.length){finish();return;}render();}
function finish(){
  document.getElementById('progress').style.width='100%';
  const pct=Math.round(score/pool.length*100);
  document.getElementById('finalScore').textContent=score+' / '+pool.length;
  document.getElementById('finalPct').textContent=pct+'% de aciertos'+(pct>=70?' · ¡aprobado! 🎉':' · sigue repasando');
  const rev=document.getElementById('review');
  if(wrong.length){
    rev.innerHTML='<p style="font-weight:600;margin:16px 0 6px">Para repasar ('+wrong.length+'):</p>'+
      wrong.map(q=>'<div class="rev"><div class="qq">'+q.q+'</div><div style="color:#13632f;margin-top:3px">✔ '+q.correct+'</div><div class="small" style="margin-top:3px">'+q.expl+'</div></div>').join('');
  } else rev.innerHTML='<p class="center" style="color:#1e8e51;font-weight:600;margin-top:16px">¡Sin fallos! 🏆</p>';
  show('result');
}
let dpool=[],didx=0;
function startDev(){dpool=DATA.dev;didx=0;renderDev();show('devview');}
function renderDev(){
  const q=dpool[didx];
  document.getElementById('devCounter').textContent='Desarrollo '+(didx+1)+' / '+dpool.length;
  document.getElementById('devTema').textContent=q.temaLabel;
  document.getElementById('devQ').textContent=q.q;
  document.getElementById('devA').value='';
  const m=document.getElementById('devModel');m.classList.remove('show');
  m.innerHTML='<b>Respuesta modelo</b><div style="margin-top:6px">'+q.model+'</div>';
  document.getElementById('devNext').textContent = didx<dpool.length-1?'Siguiente →':'Terminar';
}
function devNext(){didx++;if(didx>=dpool.length){home();return;}renderDev();}
</script>
</body>
</html>
